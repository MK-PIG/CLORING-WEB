<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="{{url_for('static',filename='sign_in.css')}}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>

<body class="page">
    <form class="form" action="" method="post">
        <div class="wrapper">
            <h1 class="title">cloring</h1>
            <p class="subtitle">{{e}}</p>
            <p class="subtitle">Введите ваши данные для входа в систему</p>
            <div class="login_wrapper">
                <label for="username">Логин</label>
                <div class="login_input">
                    <input type="email" id="email" name="email" placeholder="Введите ваш логин">
                </div>
            </div>
            <div class="password_wrapper">
                <label for="password">Пароль</label>
                <div class="password_input">
                    <input type="password" id="password" name="password" placeholder="Введите ваш пароль">
                </div>
            </div>
            <button class="login_button" type="submit">Войти</button>
        </div>
    </form>
</body>

</html>
