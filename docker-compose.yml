services:
  vlm:
    build:
      context: .
      dockerfile: Dockerfile.vlm
    image: galanovaxxx/cloring-vlm:latest
    container_name: cloring-vlm
    ports:
      - "8001:8001"
    volumes:
      - ./src:/app/src:ro
      - ./vlm_service:/app/vlm_service:ro
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: galanovaxxx/cloring-web:latest
    container_name: cloring-web
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app/src:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static
      - ./data:/app/data
    environment:
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/database.db
      - UPLOAD_FOLDER=/app/static/uploads
      - VLM_API_URL=http://vlm:8001/analyze
    depends_on:
      - vlm
    restart: unless-stopped
